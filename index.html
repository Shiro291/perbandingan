<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teks Prosedur • Urutkan Langkah</title>
  <link rel="stylesheet" href="./styles.css" />
  <!-- SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <!-- canvas-confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>Teks Prosedur</h1>
    <nav>
      <button id="navHome" class="link">Beranda</button>
      <button id="navEditor" class="link">Mode Guru</button>
    </nav>
  </header>

  <main id="viewHome" class="view">
    <section class="card">
      <h2>Pilih Prosedur</h2>
      <div class="row">
        <label for="procedureSelect">Prosedur:</label>
        <select id="procedureSelect"></select>
      </div>
      <div class="actions">
        <button id="startBtn" class="primary">Mulai</button>
      </div>
      <p class="hint">Tip: Tambahkan prosedur Anda sendiri di "Mode Guru".</p>
    </section>
  </main>

  <main id="viewGame" class="view hidden">
    <section class="card">
      <div class="game-header">
        <h2 id="gameTitle">Judul Prosedur</h2>
        <div class="meta">
          <span id="scoreBox">Skor: 0</span>
        </div>
      </div>

      <ol id="stepList" class="steps-list"></ol>

      <div class="actions">
        <button id="checkBtn" class="primary">Cek</button>
        <button id="reshuffleBtn" class="secondary">Acak Ulang</button>
        <button id="backHomeBtn" class="link">Kembali</button>
      </div>

      <div id="feedback" class="feedback"></div>
    </section>
  </main>

  <main id="viewEditor" class="view hidden">
    <section class="card">
      <h2>Editor Guru</h2>
      <div class="row">
        <label for="procTitle">Judul Prosedur</label>
        <input id="procTitle" type="text" placeholder="Mis. Memasak Nasi Goreng" />
      </div>
      <div class="row">
        <label for="procSteps">Langkah-langkah (1 per baris)</label>
        <textarea id="procSteps" rows="8" placeholder="Tulis satu langkah per baris..."></textarea>
      </div>
      <div class="actions">
        <button id="saveProcBtn" class="primary">Simpan</button>
        <button id="clearFormBtn" class="secondary">Bersihkan</button>
      </div>

      <h3>Prosedur Tersimpan</h3>
      <ul id="savedList" class="saved-list"></ul>

      <div class="actions">
        <button id="exportJsonBtn" class="secondary">Export JSON</button>
        <label class="import">
          Import JSON
          <input type="file" id="importJsonInput" accept="application/json" />
        </label>
        <button id="exportCsvBtn" class="secondary">Export CSV Hasil</button>
      </div>

      <div class="actions">
        <button id="backHomeBtn2" class="link">Kembali</button>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <small>Serverless • Simpel • Offline-friendly</small>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
